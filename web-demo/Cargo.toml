[package]
name = "web-demo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WASM bindings for the doc-index pipeline. Powers the Vercel-hosted browser demo."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Wire-format parity with the production module — same Envelope, Instruction, hashing.
registry-core = { path = "../crates/registry-core" }

# WASM bindings
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# Shared with registry-core but pinned here to keep the standalone crate self-contained.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
bs58 = "0.5"
uuid = { version = "1.10", features = ["v4", "serde", "js"] }
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# wasm-pack metadata: skip wasm-opt because the bundled version is older than the WASM
# bulk-memory feature emitted by the toolchain. Output is unminified but functional;
# re-enable once wasm-pack ships a newer wasm-opt.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
