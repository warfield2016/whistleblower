# Intermediate workspace member for the risc0-build guest binary.
#
# This crate has the build.rs that drives `risc0_build::embed_methods()`,
# which compiles the guest crate at methods/guest/ to a riscv32im-risc0-zkvm-elf
# binary. After the build, the guest ELF is emitted to:
#   target/riscv-guest/.../release/chronicle_registry
# and `lgs deploy` picks it up from there.
#
# Pattern modeled on LEZ's `program_methods/` and the scaffold's
# `methods/` template.
#
# This crate is INTENTIONALLY NOT a member of the workspace at the repo
# root — it pins git deps from logos-blockchain that we don't want
# polluting the host-side workspace, and uses edition 2024 / resolver 3
# which differ from our host crates.

[package]
name = "whistleblower_methods"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"
members = [".", "guest"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# LEZ deps — pinned to the scaffold's current LEZ pin (35d8df0d...).
# Bump together when upgrading LEZ. See:
#   ~/logos-toolchain/scaffold/templates/lez-framework/scaffold.toml
nssa = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "35d8df0d031315219f94d1546ceb862b0e5b208f" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "35d8df0d031315219f94d1546ceb862b0e5b208f" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "35d8df0d031315219f94d1546ceb862b0e5b208f" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "35d8df0d031315219f94d1546ceb862b0e5b208f" }

risc0-zkvm = { version = "3.0.5", features = ["std"] }
risc0-build = "3.0.5"

# Shared with the host workspace — use the same versions to keep wire formats
# identical across guest and off-chain consumers.
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
risc0-build.workspace = true

[package.metadata.risc0]
methods = ["guest"]
